# Build the two native binaries, run the end-to-end tests, and publish the image.
#
#   push to main      -> ghcr.io/<owner>/splitflap-emulator:latest  (+ :main, :sha-xxxxxxx)
#   tag vX.Y.Z        -> :X.Y.Z, :X.Y, :latest
#   pull request      -> build and test only
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/splitflap-emulator

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the module and gateway binaries
        run: |
          make -C module -j"$(nproc)"
          make -C gateway -j"$(nproc)"
          mkdir -p bin && cp module/build/sfmodule gateway/build/sfgateway bin/
      - name: Install the emulator and test dependencies
        run: pip install -r emulator/requirements.txt pytest httpx
      - name: Bus-level smoke test
        run: python3 tools/bustest.py --speed 5
      - name: End-to-end tests (real gateway API, real module firmware)
        run: python3 -m pytest tests -q -p no:cacheprovider

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
