# SplitFlap Emulator -- one image, one container.
#
#   docker compose up -d        (or: docker run -d -p 8080:80 -p 8090:8090 -v emulator-data:/data ghcr.io/avandeputte/splitflap-emulator)
#
# Ports on the host:
#   8080  the emulated gateway's dashboard and REST API (the real firmware's port 80)
#   8090  the emulator's control panel (/) and virtual wall (/display)
services:
  emulator:
    build: .
    image: ghcr.io/avandeputte/splitflap-emulator:latest
    container_name: splitflap-emulator
    ports:
      - "8080:80"
      - "8090:8090"
    volumes:
      - emulator-data:/data
    environment:
      # How a browser on the host reaches the emulated gateway (used for links in the control panel).
      SFEMU_GATEWAY_URL: "http://localhost:8080"
      # Time runs at this pace (1 = the physical pace). Also adjustable live in the control panel.
      # SFEMU_SPEED: "1"
      # Wall size for a fresh data volume (later changes: control panel). Default 3 x 15.
      # SFEMU_ROWS: "3"
      # SFEMU_COLS: "15"
    restart: unless-stopped

volumes:
  emulator-data:
